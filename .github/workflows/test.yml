name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Serve a page that sends every header
        run: |
          node example/serve.js 8787 &
          sleep 1
      - name: Run the action from this commit
        id: headers
        uses: ./
        with:
          url: http://127.0.0.1:8787
          min-grade: A
      - name: The grade comes back as an output
        run: test "${{ steps.headers.outputs.grade }}" = "A+"
